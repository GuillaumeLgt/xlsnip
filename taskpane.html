<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XLSnip</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
:root{--g:#217346;--bd:#d0d0d0;--bg:#fff;--tx:#222}
@media(prefers-color-scheme:dark){:root{--bd:#555;--bg:#1e1e1e;--tx:#eee}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font:13px Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
body{display:flex;flex-direction:column}
.bar{display:flex;gap:6px;align-items:center;padding:5px 6px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
button,select{font:inherit;padding:4px 8px;border:1px solid var(--bd);background:transparent;color:inherit;border-radius:4px;cursor:pointer}
button.p{background:var(--g);color:#fff;border-color:var(--g)}
.seg button{border-radius:0}.seg button:first-child{border-radius:4px 0 0 4px}.seg button:last-child{border-radius:0 4px 4px 0}
.seg button.on{background:var(--g);color:#fff;border-color:var(--g)}
#docs{flex:1;min-width:80px;max-width:100%}
#view{flex:1;overflow:auto;background:#808080;padding:8px;position:relative}
#wrap{position:relative;display:inline-block;background:#fff;box-shadow:0 1px 6px #0006}
#ov{position:absolute;inset:0;cursor:crosshair;touch-action:none}
.sel{position:absolute;border:2px solid #d83b01;background:#d83b0122;pointer-events:none}
.mark{position:absolute;border:1px solid var(--g);background:#21734622;pointer-events:none}
.mark.ok{border-color:#00a000;background:#00c85033}.mark.nok{border-color:#c00000;background:#ff000033}
.mark.f{border:2px solid #0078d4;background:#0078d433}
#st{padding:4px 8px;font-size:12px;border-top:1px solid var(--bd);min-height:24px}
#empty{color:#fff;padding:20px;text-align:center}
#pg{width:58px;padding:3px 4px;border:1px solid var(--bd);border-radius:4px;background:transparent;color:inherit;font:inherit;text-align:center}
label{display:flex;align-items:center;gap:3px;white-space:nowrap}
#cm{position:fixed;display:none;z-index:9;background:var(--bg);border:1px solid var(--bd);border-radius:4px;box-shadow:0 2px 8px #0005;padding:3px;min-width:200px}
#cm button{display:block;width:100%;text-align:left;border:0;padding:6px 8px}
#cm button:hover{background:var(--g);color:#fff}
[hidden]{display:none!important}
#modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:20}
.box{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:12px;width:min(340px,92%)}
.box h3{margin:0 0 8px;font-size:14px}.box p{margin:6px 0}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.gtools{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 10px}
.gl{max-height:170px;overflow:auto;border:1px solid var(--bd);border-radius:4px;padding:4px;margin:6px 0}
.gl label{white-space:normal;padding:2px 0;align-items:flex-start}
.box ul{margin:6px 0;padding-left:18px}
</style>
</head>
<body>
<div class="bar">
  <button class="p" id="imp">+ Importer</button>
  <input type="file" id="file" accept=".pdf,image/*" multiple hidden>
  <select id="docs"></select>
  <button id="del" title="Retirer ce document du classeur">🗑</button>
</div>
<div class="bar">
  <span>Alléger :</span>
  <button id="cmp" title="Compresser les documents intégrés au classeur">Compresser</button>
  <button id="gray" title="Passer des documents en niveaux de gris">Niveaux de gris</button>
  <button id="dup" title="Supprimer les documents importés plusieurs fois">Doublons</button>
</div>
<div class="bar">
  <div class="seg" id="modes">
    <button data-m="text" class="on" title="Récupère le texte de la zone. Avec Ctrl : ajoute à la case précédente">Texte</button><button data-m="num" title="Récupère un nombre">Nombre</button><button data-m="sum" title="Additionne les nombres de la zone. Avec Ctrl : ajoute à la case précédente">Σ Somme</button><button data-m="table" title="Récupère un tableau">Tableau</button><button data-m="ok" title="Pointer comme valide (✓ vert)">✓ Valide</button><button data-m="nok" title="Pointer comme invalide (✗ rouge)">✗ Invalide</button>
  </div>
  <label><input type="checkbox" id="hl" checked>Surligner</label>
  <label><input type="checkbox" id="follow" checked>Suivre la source</label>
</div>
<div class="bar">
  <button id="prev">◀</button><input type="number" id="pg" min="1" step="1" title="Aller à la page…" aria-label="Numéro de page"><span id="pn">/ –</span><button id="next">▶</button>
  <button id="zo">−</button><button id="zi">+</button><button id="fit">Ajuster</button>
</div>
<div id="view">
  <div id="empty">Importez un PDF ou une image (bouton « + Importer »).<br>Puis sélectionnez une cellule Excel et tracez une zone sur le document.</div>
  <div id="wrap" hidden><canvas id="cv"></canvas><div id="ov"></div></div>
</div>
<div id="modal" hidden><div class="box"><h3 id="mt"></h3><div id="mb"></div><div class="row"><button id="mno">Annuler</button><button class="p" id="mok">Valider</button></div></div></div>
<div id="st">Prêt.</div>
<script src="taskpane.js"></script>
</body>
</html>
